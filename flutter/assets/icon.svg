<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b6dff"/>
      <stop offset="0.55" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cloud" x1="150" y1="170" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b2a66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="#ffffff" opacity="0.05"/>

  <!-- cloud (union of circles + base bar) -->
  <g filter="url(#sh)" fill="url(#cloud)">
    <rect x="150" y="248" width="228" height="86" rx="43"/>
    <circle cx="205" cy="286" r="58"/>
    <circle cx="256" cy="238" r="74"/>
    <circle cx="322" cy="278" r="62"/>
    <circle cx="228" cy="228" r="46"/>
  </g>

  <!-- remote cursor arrow -->
  <g transform="translate(214 196) rotate(10)">
    <path fill="#2456d6" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"
      d="M0 0 L110 46 L60 63 L45 114 Z"/>
  </g>

  <!-- link node + arc (remote signal) -->
  <path d="M296 150 q44 -40 92 -6" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <circle cx="388" cy="150" r="17" fill="#ffffff"/>
  <circle cx="388" cy="150" r="8" fill="#22d3ee"/>
</svg>
